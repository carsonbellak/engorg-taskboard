org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Firebase project's OAuth "Web client ID" (public — Firebase Console → Authentication →
# Sign-in method → Google → Web SDK configuration). Native Google Sign-In requests an
# ID token for this client, which Firebase then accepts via signInWithCredential.
WEB_CLIENT_ID=
