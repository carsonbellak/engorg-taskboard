name: Build Ink APK

# Builds the native ink APK and, on main, attaches it to the rolling "latest" GitHub
# Release as EngOrg-Ink.apk (a public, no-login, non-expiring download for sideloading).
# Trigger manually (Actions tab → Run workflow) or on changes under mobile-ink/.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile-ink/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The ubuntu-latest runner already ships the Android SDK at $ANDROID_SDK_ROOT, so
      # we skip android-actions/setup-android (its v3 tries to install the obsolete
      # "tools" package and fails). Just accept licenses so AGP can auto-download any
      # missing platform/build-tools during the build.
      - name: Accept Android SDK licenses
        run: yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: mobile-ink
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Stage APK
        shell: bash
        run: cp "$(ls mobile-ink/app/build/outputs/apk/debug/*.apk | head -1)" EngOrg-Ink.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: engorg-ink-apk
          path: EngOrg-Ink.apk
          if-no-files-found: error

      - name: Attach to the "latest" release
        if: github.ref_name == 'main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="$GITHUB_REPOSITORY"
          # The "latest" rolling release is created by the installer workflow; upload if it
          # exists, otherwise create it so the APK still has a stable public URL.
          gh release view latest -R "$REPO" >/dev/null 2>&1 || \
            gh release create latest -R "$REPO" --title "EngOrg (latest build)" --notes "Rolling latest build." --latest || true
          gh release upload latest EngOrg-Ink.apk -R "$REPO" --clobber
