name: Build Ink POC APK

# Builds the native ink proof-of-concept and uploads a sideloadable debug APK.
# Trigger manually (Actions tab → Run workflow) or on changes under mobile-ink/.
on:
  workflow_dispatch:
  push:
    paths:
      - "mobile-ink/**"
      - ".github/workflows/build-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: mobile-ink
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: inkpoc-debug-apk
          path: mobile-ink/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
