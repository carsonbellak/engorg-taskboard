<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio</title>
  <meta name="description" content="Engineering portfolio: projects, interactive CAD models, PCB designs and drawings.">
  <meta name="theme-color" content="#14161b" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
  <link rel="icon" href="/icon-192.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;700&family=Google+Sans+Code:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/portfolio/portfolio.css">
</head>
<body>
  <a class="skip" href="#projects">Skip to projects</a>

  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="#" data-brand></a>
      <nav class="topnav" aria-label="Sections">
        <a href="#projects">Projects</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
        <a class="btn btn-sm btn-primary" data-resume hidden target="_blank" rel="noopener">Resume</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero wrap">
      <div class="hero-text">
        <p class="eyebrow" data-role></p>
        <h1 data-name></h1>
        <p class="hero-tagline" data-tagline></p>
        <div class="hero-actions">
          <a class="btn btn-primary" href="#projects">View projects</a>
          <a class="btn" data-resume hidden target="_blank" rel="noopener">Resume</a>
          <a class="btn" href="#contact">Contact</a>
        </div>
      </div>

      <figure class="showcase" data-showcase hidden aria-roledescription="carousel" aria-label="CAD models I designed">
        <div class="stage showcase-stage" data-sc-stage></div>
        <div class="showcase-bar">
          <a class="showcase-label" data-sc-label href="#"></a>
          <div class="showcase-nav">
            <button type="button" class="icon-btn" data-sc-prev aria-label="Previous model">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
            </button>
            <div class="showcase-dots" data-sc-dots role="tablist"></div>
            <button type="button" class="icon-btn" data-sc-next aria-label="Next model">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
            </button>
          </div>
        </div>
        <figcaption class="mono showcase-hint">Drag to orbit · scroll to zoom</figcaption>
      </figure>
    </section>

    <section id="projects" class="wrap section">
      <div class="section-head">
        <h2>Projects</h2>
        <nav class="proj-index" aria-label="Project list" data-index></nav>
      </div>
      <div class="projects" data-projects></div>
    </section>

    <section id="about" class="wrap section about">
      <div class="about-text">
        <h2>About</h2>
        <div data-about></div>
      </div>
      <div class="about-side">
        <img class="about-photo" data-photo alt="" hidden>
        <div class="skills" data-skills></div>
      </div>
    </section>

    <section id="contact" class="wrap section contact">
      <h2>Get in touch</h2>
      <div class="contact-links" data-contact></div>
    </section>
  </main>

  <footer class="wrap footer mono"><span data-footer></span></footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/environments/RoomEnvironment.js"></script>
  <script src="/portfolio/content.js"></script>
  <script src="/portfolio/viewers.js"></script>
  <script src="/portfolio/portfolio.js"></script>
</body>
</html>
